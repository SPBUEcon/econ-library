# Паспорт воркстрима — машиночитаемая строка карты воркстримов.
#
# Из этих файлов собираются таблицы в workstreams/README.md («Воркстримы», «Среда управления»,
# «Ближайшие действия») и живость в workstreams/curators.md. Руками эти таблицы не правятся: поменяйте
# поле здесь — после слияния в main карта пересоберётся сама (GitHub Actions), локально —
#     python program/site/build-workstreams.py
#
# Значения — как в карточке README.md этой папки; данные не придумывать, нет данных — «уточнить».
# Можно markdown; относительные ссылки пишутся от этой папки. Значение с «:» в начале или с « #»
# берите в кавычки.

id: <имя-папки>              # обязательно; совпадает с именем папки (латиница, нижний регистр, дефис)
n: <номер в карте>           # обязательно для section: map и infra; порядок строк и «№» в ссылках
title: <Название>            # обязательно
section: map                 # map — сводная карта · infra — инфраструктурный · hub — поток-хаб (не в карте)
kind: оперативный            # оперативный · сквозной · событие · флагман · прото · инфраструктурный · хаб
stream: <Поток (лендинг)>
level: A · семестр           # уровень / горизонт, как в карте
partner: <Организация — ФИО (должность)>
partner_role: <Владелец / Эксперт / Шерпа / Кадровый потребитель>
supertask: <Суперзадача в одну строку>
team_sources: <Откуда приходят команды>
stands: []                   # id стендов из stands/, например [insurance]
stand_note: ""               # пометка к стенду, например «в согласовании»
status: <Статус как в источнике>
next_action: <Ближайшее действие>
next_action_status: <Рамка собирается / Идея / …>
